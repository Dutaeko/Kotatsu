name: Android Debug Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: android-debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kotatsu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
